[workspace]
resolver = "2"
members = ["crates/clipvault-core", "crates/clipvault"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The vault KDF is meant to be slow; unoptimised it is slower still, enough
# to make debug builds miserable. Optimise just the crypto in dev builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
